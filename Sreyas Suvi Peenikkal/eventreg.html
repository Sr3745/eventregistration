<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Tournament Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="form-container">
<h1>Tournament Registration</h1>
<form>
<label for="teamName">Team Name:</label>
<input type="text" id="teamName" name="teamName" required>

<label for="email">Contact Email:</label>
<input type="email" id="email" name="email" required>

<label>Team Category:</label>
<div class="radio-group">
<input type="radio" id="u18" name="category" value="u18">
<label for="u18">Under 18</label>
<input type="radio" id="open" name="category" value="open">
<label for="open">Open Age</label>
</div>

<label for="skillLevel">Skill Level:</label>
<select id="skillLevel" name="skillLevel">
<option value="beginner">Beginner</option>
<option value="amateur">Amateur</option>
<option value="pro">Professional</option>
</select>

<label for="players">Number of Players:</label>
<input type="number" id="players" name="players" min="5" max="15">

<button type="submit">Register Team</button>
</form>
</div>
</body>
</html>
